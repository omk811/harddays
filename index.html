<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>في أيام الشدة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        body { box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        * { font-family: 'Tajawal', Arial, sans-serif; }

        .vocab-word {
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: all 0.2s;
        }
        .vocab-word:hover { transform: translateY(-2px); }
        .vocab-tooltip {
            position: absolute;
            bottom: 100%;
            right: 50%;
            transform: translateX(50%) translateY(-8px);
            background: white;
            border: 4px solid;
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            white-space: nowrap;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            font-weight: 800;
            font-size: 1.3rem;
        }
        .vocab-tooltip.active {
            opacity: 1;
            transform: translateX(50%) translateY(-12px);
        }
        .vocab-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 50%;
            transform: translateX(50%);
            border: 12px solid transparent;
            border-top-color: inherit;
        }

        .section-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .section-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        .quiz-option {
            transition: all 0.3s;
            cursor: pointer;
        }
        .quiz-option:hover:not(.disabled) {
            transform: translateX(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .quiz-option.correct { animation: correctPulse 0.7s ease-out; }
        .quiz-option.incorrect { animation: incorrectShake 0.6s ease-out; }
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.08); }
            60% { transform: scale(0.98); }
        }
        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full bg-white">
<div id="app" class="w-full h-full overflow-auto"></div>
<script>
// ======================== بيانات الدرس ========================
const config = {
    lesson_title: "في أيام الشدة",
    main_idea: "التضامن والتعاون والعطاء في الأزمات، وقدوة الأم في مساعدة الجيران.",
    quiz_title: "اختبر فهمك للدرس",
    background_color: "#ffffff",
    surface_color: "#fefce8",
    text_color: "#78350f",
    primary_color: "#d97706",
    accent_color: "#b45309"
};

const lessonData = {
    sections: [
        {
            id: 1,
            title: "مواجهة الأزمة",
            partialIdea: "الناس تشبثوا بالحياة بكل قوة",
            content: `
                إنّني لا أعرف، أو لا أذكر تفاصيلَ الأزمةِ التي واجهها الناسُ في سنواتِ الشدّةِ، لا أدري كيفَ تصرّفوا، وماذا فعلوا، ولا بأيّةِ وسائلَ صمدوا.
                لقد <span class="vocab-word" data-meaning="تمسكوا بقوة">تشبّثوا</span> بالحياةِ بكلّ ما فيهم من قوّةٍ؛
                فقد جابوا المدينةَ باحثينَ عن العملِ والرزقِ، واستعانوا بالناسِ، كما استعانَ الناسُ بهم، وباعوا واشترّوا ما وسِعَهُم ذلك،
                وادّخروا بعضًا مما كسبوا، واقتصدوا في العيشِ ما استطاعوا إلى ذلك سبيلاً، ورُغمَ هذا ظلَّ الحيُّ يعاني من صعوباتٍ جَمَّةٍ.
            `
        },
        {
            id: 2,
            title: "قدوة الأم وعطاؤها",
            partialIdea: "الأم تجمع الفائض وتهبه للجيران",
            content: `
                بَدَتْ عائِلَتُنا أَفْضَلَ حالاً من العائلاتِ الأخرى، فالطعامُ وغيرُه، على ندرَتِه، موفورٌ عندَنا،
                وكثيرًا ما كانتْ أُمّي تَجْمَعُ ما فاضَ عن حاجتِنا، وَتَخْرُجُ في المساءِ <span class="vocab-word" data-meaning="لتعطي">لِتَهَبَ</span> ما تَقْدُرُ أنَّه يَزِيدُ عن حاجَتِنا للجيرانِ،
                وهي سَعيدةٌ بذلك غايةَ السعادةِ، مستشعِرةً راحةً نفسيةً؛ إذ يسَّرَ اللهُ لها أن تَمُدَّ يدًا للناسِ كما مدَّ الناسُ أيدِيَهُم إلينا فيما مضى.
                كانت كلَّ صباحٍ تَسْأَلُ ربَّها أن <span class="vocab-word" data-meaning="يرحم ويرأف">يَرْأَفَ</span> بالعبادِ، ويرزقَهم من فيضِ خيرِه، وأنْ يَحْوِيَ الأطفالَ في حِنايَةِ الأمراضِ والمخاطرِ، ويُعْطِيَ الآباءَ والأمهاتِ الصحةَ والعافيةَ،
                حتى إذا انتهتْ من ذلك نهضَتْ وانصرفَتْ إلى ترتيبِ البيتِ، قبلَ أن تحمِلَ سَلَّتَها، وتذهبَ للبحثِ عمَّن يحتاجُ إلى عَوْنٍ.
            `
        },
        {
            id: 3,
            title: "وصايا الأم لابنها",
            partialIdea: "التأديب والحث على مشاركة الطعام",
            content: `
                كانت تَوْصِيني قبل ذهابِها أن أكونَ مُهَذَّبًا، وألا ألعبَ في الترابِ، وألا أُوَسِّخَ ثيابي، وألا أُسِيءَ إلى الآخرينَ، وألا أتشاجرَ مع رفاقي.
                وكانت تقول لي: "إذا كنتَ تأكلُ شيئًا ورأيتَ طفلاً إلى جانبِكَ، فَادْعُه إلى مشاركتِكَ طعامَكَ؛ يجبُ ألا نَشْبَعَ نحنُ ويجوعَ الآخرونَ، اللهُ لا يرضى عن ذلك، إنَّه يرانا ويُحاسِبُنا،
                وعلينا أن نعملَ لمرضاتِه، وأن نتذكَّرَ دائمًا أنَّ حالَنا مثلُ حالِ أهلِ الحيِّ، وأنَّ علينا واجبَ مساعدتِهم إذا استطعْنا."
                وقالت لي مرةً: "ألا تذكُرُ ذلك الطفلَ الذي كان يأكلُ طعامَه، ولم يَدْعُكَ إلى مشاركتِه مما يأكلُ؟ لا تكنْ مثله.
                أنت تعرفُ ذلك الشعورَ، لقد احتجْنا كثيرًا يا بُنَيَّ، وكان الجيرانُ في كلِّ مكانٍ يساعدونَنا، ويُرسلون إلينا كلَّ ما نحتاجُه،
                وعلينا اليومَ أن نفعلَ مثلَهم، وأن نَعْطِفَ على الجيرانِ ونساعدَهم، ونُقَسِّمَ قطعةَ الخُبْزِ بينَنا."
            `
        },
        {
            id: 4,
            title: "الابن يقتدي بأمه",
            partialIdea: "الابن يحمل الطعام والمال للجيران",
            content: `
                من أجلِ ذلك، وحتى دونَ أن تكونَ أُمّي بحاجةٍ إلى تذكيري، كنتُ أحمِلُ ما في يدي من أكلٍ أو غيرِه إلى الأطفالِ في حَيِّنا.
                وكنتُ أُسِرُّ إذ أراها تحمِلُ بعضَ الأشياءِ من بيتِنا إلى جيرانِنا.
                وكانت أحيانًا تَمُدُّ يدَها إلى حقيبتَيْها، وتتناوَلُ منديلاً عَقَدَتْ طَرَفَه على بعضِ المالِ، فتُعْطي منه هذه الجارةَ أو تلك،
                وكانت تُطْلِعُني على كلِّ شيءٍ، وتفتحُ قلبَها لي، <span class="vocab-word" data-meaning="وتشجعني">وتَحُثُّني</span> على عملِ الخيرِ، وتثقُ بأنَّني أُطيعُها وأنفِّذُ رغباتِها.
            `
        }
    ],
    quiz: [
        {
            question: "ماذا فعل الناس في سنوات الشدة؟",
            options: ["استسلموا", "تشبثوا بالحياة وبحثوا عن العمل", "تركوا المدينة", "ناموا طوال اليوم"],
            correct: 1
        },
        {
            question: "ماذا كانت تفعل الأم بفائض الطعام؟",
            options: ["تتخلص منه", "تهبه للجيران", "تخبئه", "تبيعه"],
            correct: 1
        },
        {
            question: "كلمة (لِتَهَبَ) تعني:",
            options: ["لتمسك", "لتدفع", "لتعطي", "لتقبل"],
            correct: 2
        },
        {
            question: "ماذا أوصت الأم ابنها أن يفعل إذا رأى طفلاً يأكل بجانبه؟",
            options: ["يبتعد عنه", "يدعوه للمشاركة", "يأخذ طعامه", "يضحك عليه"],
            correct: 1
        },
        {
            question: "ما القيمة الأساسية التي تعلمها الابن من أمه؟",
            options: ["الأنانية", "العطاء والتضامن", "الكسل", "المال"],
            correct: 1
        }
    ]
};

// ======================== دوال العرض ========================
function renderLesson() {
    const app = document.getElementById('app');
    const { background_color, surface_color, text_color, primary_color, accent_color, lesson_title, main_idea, quiz_title } = config;
    app.style.backgroundColor = background_color;
    app.style.color = text_color;

    let html = `
        <div class="max-w-7xl mx-auto px-8 py-20">
            <header class="text-center mb-20 animate-fade-in">
                <div class="inline-flex items-center justify-center p-8 rounded-3xl mb-10" style="background: ${primary_color}20; border: 4px solid ${primary_color};">
                    <svg class="w-24 h-24" style="color: ${primary_color};" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <h1 class="text-7xl font-black mb-8" style="color: ${primary_color}; text-shadow: 0 4px 15px ${primary_color}30;">${lesson_title}</h1>
                <div class="max-w-4xl mx-auto">
                    <div class="inline-block px-12 py-7 rounded-3xl shadow-2xl" style="background: ${surface_color}; border: 5px solid ${accent_color};">
                        <p class="text-3xl font-bold leading-relaxed" style="color: ${text_color};">💡 ${main_idea}</p>
                    </div>
                </div>
            </header>

            <div class="space-y-12 mb-24">
    `;

    lessonData.sections.forEach((section, index) => {
        html += `
            <div class="section-card rounded-3xl p-12 shadow-2xl" style="background: ${surface_color}; border-right: 10px solid ${primary_color};">
                <div class="flex items-start gap-8 mb-8">
                    <div class="flex-shrink-0 w-20 h-20 rounded-2xl flex items-center justify-center text-3xl font-black shadow-xl" style="background: ${primary_color}; color: white;">${index + 1}</div>
                    <div class="flex-1">
                        <h2 class="text-4xl font-black mb-5" style="color: ${primary_color};">${section.title}</h2>
                        <p class="text-2xl font-bold px-8 py-4 rounded-2xl inline-block shadow-md" style="background-color: ${accent_color}20; color: ${text_color}; border-right: 5px solid ${accent_color};">📌 ${section.partialIdea}</p>
                    </div>
                </div>
                <div class="text-3xl leading-loose pr-24 font-semibold" style="color: ${text_color};" id="section-${section.id}">${section.content}</div>
            </div>
        `;
    });

    // أنشطة الفهم القرائي
    html += `
        </div>
        <div class="rounded-3xl p-12 shadow-2xl mb-12" style="background: ${surface_color}; border: 5px solid ${accent_color};">
            <div class="text-center mb-12">
                <div class="inline-flex p-8 rounded-full mb-8 shadow-2xl" style="background: ${accent_color};">
                    <svg class="w-20 h-20" style="color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <h2 class="text-6xl font-black mb-5" style="color: ${accent_color};">أنشطة الفهم القرائي</h2>
                <p class="text-3xl font-bold" style="color: ${text_color};">اضغط على كلمة "الإجابة" لمعرفة الحل الصحيح 📖</p>
            </div>
            <div id="activities-content"></div>
        </div>

        <div class="rounded-3xl p-12 shadow-2xl" style="background: ${surface_color}; border: 5px solid ${primary_color};">
            <div class="text-center mb-12">
                <div class="inline-flex p-8 rounded-full mb-8 shadow-2xl" style="background: ${primary_color};">
                    <svg class="w-20 h-20" style="color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h2 class="text-6xl font-black mb-5" style="color: ${primary_color}; text-shadow: 0 3px 12px ${primary_color}30;">${quiz_title}</h2>
                <p class="text-3xl font-bold" style="color: ${text_color};">أجب عن الأسئلة التالية لتتأكد من فهمك للدرس 📝</p>
            </div>
            <div id="quiz-content"></div>
        </div>

        <footer class="mt-20 text-center rounded-3xl p-12 shadow-2xl" style="background: ${primary_color};">
            <div class="inline-flex p-6 rounded-full mb-6 shadow-xl" style="background: white;">
                <svg class="w-16 h-16" style="color: ${primary_color};" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h3 class="text-5xl font-black mb-4" style="color: white;">الأستاذ خليل البلوشي</h3>
            <div class="flex items-center justify-center gap-4 mb-2">
                <svg class="w-10 h-10" style="color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
                <p class="text-3xl font-bold" style="color: white;">مدرسة: سعد بن معاذ للتعليم الأساسي</p>
            </div>
        </footer>
    </div>
    `;

    app.innerHTML = html;

    // إضافة الكلمات التفاعلية
    lessonData.sections.forEach(section => {
        const sectionEl = document.getElementById(`section-${section.id}`);
        const vocabWords = sectionEl.querySelectorAll('.vocab-word');
        vocabWords.forEach(word => {
            const meaning = word.dataset.meaning;
            word.style.color = accent_color;
            word.style.fontWeight = '900';
            word.style.borderBottom = `4px solid ${accent_color}`;
            word.style.paddingBottom = '3px';

            const tooltip = document.createElement('div');
            tooltip.className = 'vocab-tooltip';
            tooltip.textContent = `✦ ${meaning}`;
            tooltip.style.backgroundColor = 'white';
            tooltip.style.borderColor = accent_color;
            tooltip.style.color = text_color;
            word.appendChild(tooltip);

            word.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.vocab-tooltip').forEach(t => {
                    if (t !== tooltip) t.classList.remove('active');
                });
                tooltip.classList.toggle('active');
            });
        });
    });
    document.addEventListener('click', () => {
        document.querySelectorAll('.vocab-tooltip').forEach(t => t.classList.remove('active'));
    });

    renderActivities();
    renderQuiz();
}

// ======================== الأنشطة ========================
function renderActivities() {
    const container = document.getElementById('activities-content');
    const { surface_color, text_color, primary_color, accent_color } = config;

    const activities = [
        {
            title: "أولاً: ثروتي اللغوية",
            questions: [
                {
                    question: "1️⃣ استخرج من النص كلمة أو عبارة توافق المعنى التالي:",
                    items: [
                        { label: "تمسكوا بقوة", answer: "تشبّثوا" },
                        { label: "لتعطي", answer: "لتهب" },
                        { label: "يرحم", answer: "يرأف" },
                        { label: "وتشجعني", answer: "وتحثني" }
                    ],
                    type: "fill"
                },
                {
                    question: "2️⃣ اختر مضاد كلمة (لِتَهَبَ):",
                    options: ["لتمسك", "لتدفع", "لتعطي", "لتقبل"],
                    correct: 0,
                    type: "choice"
                },
                {
                    question: "3️⃣ اكتب مرادفاً لكلمة (تشبّثوا):",
                    type: "rewrite",
                    items: [
                        { original: "تشبّثوا", answer: "تمسكوا" }
                    ]
                }
            ]
        },
        {
            title: "ثانياً: أناقش وأحلل",
            questions: [
                {
                    question: "4️⃣ استنتج الفكرة العامة للنص.",
                    type: "explain",
                    answer: "التضامن والتعاون والعطاء في الأزمات، وقدوة الأم في مساعدة الجيران."
                },
                {
                    question: "5️⃣ اذكر ثلاث وصايا من وصايا الأم لابنها.",
                    type: "list",
                    items: [
                        "ألا يلعب في التراب",
                        "ألا يوسخ ثيابه",
                        "ألا يتشاجر مع رفاقه"
                    ]
                },
                {
                    question: "6️⃣ كيف كانت الأم قدوة لابنها؟",
                    type: "explain",
                    answer: "كانت تحمل الطعام والمال للجيران، وتعلمه العطف والتضامن، وتفتح قلبها له وتحثه على الخير."
                }
            ]
        }
    ];

    let html = '';
    activities.forEach((section, sIdx) => {
        html += `
            <div class="mb-14">
                <div class="mb-10 pr-10 py-5 rounded-r-3xl inline-block shadow-2xl" style="background: ${accent_color};">
                    <h3 class="text-5xl font-black" style="color: white;">${section.title}</h3>
                </div>
                <div class="space-y-10">
        `;
        section.questions.forEach((q, qIdx) => {
            const answerId = `act-${sIdx}-${qIdx}`;
            html += `
                <div class="rounded-3xl p-10 shadow-2xl" style="background-color: white; border-right: 8px solid ${accent_color};">
                    <p class="text-3xl font-bold mb-8 leading-relaxed" style="color: ${text_color};">${q.question}</p>
            `;

            if (q.type === 'fill') {
                q.items.forEach(item => {
                    html += `<div class="flex items-center gap-5 pr-8"><span class="text-2xl font-black min-w-40" style="color: ${primary_color};">${item.label}:</span><div class="flex-1 h-2 rounded-full" style="background-color: ${surface_color};"></div></div>`;
                });
            } else if (q.type === 'list') {
                q.items.forEach((item, idx) => {
                    html += `<div class="flex items-start gap-5"><span class="text-2xl font-black" style="color: ${primary_color};">${idx+1}-</span><div class="flex-1 h-2 rounded-full" style="background-color: ${surface_color};"></div></div>`;
                });
            } else if (q.type === 'rewrite') {
                q.items.forEach(item => {
                    html += `<div class="mb-4"><p class="text-2xl mb-4 font-semibold" style="color: ${text_color};">${item.original}</p><div class="h-2 rounded-full" style="background-color: ${surface_color};"></div></div>`;
                });
            } else if (q.type === 'choice') {
                q.options.forEach(opt => {
                    html += `<div class="pr-8 py-5 rounded-2xl shadow-md mb-3" style="background-color: ${surface_color}; border: 2px solid ${primary_color};"><span class="text-2xl font-semibold" style="color: ${text_color};">▢ ${opt}</span></div>`;
                });
            } else if (q.type === 'explain') {
                html += `<div class="space-y-3"><div class="h-2 rounded-full" style="background-color: ${surface_color};"></div><div class="h-2 rounded-full" style="background-color: ${surface_color};"></div></div>`;
            }

            html += `
                    <div class="mt-8 text-center">
                        <button class="show-answer-btn px-12 py-5 rounded-2xl text-2xl font-black shadow-2xl transition-all hover:scale-110" style="background: ${primary_color}; color: white;" data-answer-id="${answerId}">👁️ الإجابة</button>
                    </div>
                    <div id="${answerId}" class="answer-content mt-8 p-8 rounded-3xl hidden animate-fade-in shadow-xl" style="background: ${accent_color}20; border: 4px solid ${accent_color};">
            `;
            if (q.type === 'fill') {
                q.items.forEach(item => html += `<p class="text-2xl font-black" style="color: ${accent_color};">✅ ${item.label}: ${item.answer}</p>`);
            } else if (q.type === 'list') {
                q.items.forEach((item, idx) => html += `<p class="text-2xl font-black" style="color: ${accent_color};">${idx+1}- ${item}</p>`);
            } else if (q.type === 'rewrite') {
                q.items.forEach(item => html += `<p class="text-2xl font-black" style="color: ${accent_color};">✅ ${item.answer}</p>`);
            } else if (q.type === 'choice') {
                html += `<p class="text-2xl font-black" style="color: ${accent_color};">✅ الإجابة الصحيحة: ${q.options[q.correct]}</p>`;
            } else if (q.type === 'explain') {
                html += `<p class="text-2xl font-black" style="color: ${accent_color};">${q.answer}</p>`;
            }
            html += `</div></div>`;
        });
        html += `</div></div>`;
    });

    container.innerHTML = html;

    document.querySelectorAll('.show-answer-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const answerDiv = document.getElementById(this.dataset.answerId);
            if (answerDiv.classList.contains('hidden')) {
                answerDiv.classList.remove('hidden');
                this.innerHTML = '🔼 إخفاء الإجابة';
            } else {
                answerDiv.classList.add('hidden');
                this.innerHTML = '👁️ الإجابة';
            }
        });
    });
}

// ======================== الاختبار التفاعلي ========================
let currentQuestionIndex = 0;
let score = 0;
let quizStarted = false;
let selectedAnswers = [];

function renderQuiz() {
    const container = document.getElementById('quiz-content');
    const { primary_color, accent_color, surface_color, text_color } = config;

    if (!quizStarted) {
        container.innerHTML = `
            <div class="text-center py-20">
                <button id="start-quiz-btn" class="px-20 py-8 rounded-3xl text-4xl font-black shadow-2xl transition-all hover:scale-110" style="background: ${primary_color}; color: white;">🎯 ابدأ الاختبار</button>
            </div>
        `;
        document.getElementById('start-quiz-btn').addEventListener('click', () => {
            quizStarted = true;
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswers = new Array(lessonData.quiz.length).fill(null);
            renderQuiz();
        });
        return;
    }

    if (currentQuestionIndex >= lessonData.quiz.length) {
        const percentage = Math.round((score / lessonData.quiz.length) * 100);
        let emoji = '🎉', message = 'ممتاز! أنت فهمت الدرس بشكل رائع!', msgColor = accent_color;
        if (percentage < 50) { emoji = '📚'; message = 'حاول مراجعة الدرس مرة أخرى'; msgColor = primary_color; }
        else if (percentage < 80) { emoji = '👍'; message = 'جيد جداً! مع القليل من المراجعة ستكون ممتازاً'; }
        container.innerHTML = `
            <div class="text-center py-20 animate-fade-in">
                <div class="text-9xl mb-10">${emoji}</div>
                <h3 class="text-6xl font-black mb-8" style="color: ${msgColor};">النتيجة: ${score} من ${lessonData.quiz.length}</h3>
                <div class="inline-block px-16 py-8 rounded-3xl mb-10 shadow-2xl" style="background: ${primary_color};"><div class="text-8xl font-black" style="color: white;">${percentage}%</div></div>
                <p class="text-4xl font-bold mb-12" style="color: ${text_color};">${message}</p>
                <button id="retry-btn" class="px-16 py-6 rounded-3xl text-3xl font-black shadow-2xl transition-all hover:scale-110" style="background: ${primary_color}; color: white;">🔄 أعد المحاولة</button>
            </div>
        `;
        document.getElementById('retry-btn').addEventListener('click', () => {
            quizStarted = false;
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswers = [];
            renderQuiz();
        });
        return;
    }

    const q = lessonData.quiz[currentQuestionIndex];
    const progress = ((currentQuestionIndex) / lessonData.quiz.length) * 100;

    container.innerHTML = `
        <div class="mb-12">
            <div class="flex justify-between items-center mb-6">
                <span class="text-3xl font-black px-8 py-4 rounded-2xl shadow-lg" style="color: ${text_color}; background-color: white; border: 3px solid ${primary_color};">السؤال ${currentQuestionIndex+1} من ${lessonData.quiz.length}</span>
                <span class="text-3xl font-black px-8 py-4 rounded-2xl shadow-lg" style="color: white; background: ${primary_color};">النقاط: ${score}</span>
            </div>
            <div class="w-full h-5 rounded-full shadow-inner" style="background-color: ${surface_color}; border: 2px solid ${primary_color};">
                <div class="progress-bar h-full rounded-full shadow-lg transition-all" style="width: ${progress}%; background: ${primary_color};"></div>
            </div>
        </div>
        <div class="rounded-3xl p-12 mb-12 shadow-2xl" style="background-color: white; border: 4px solid ${primary_color};">
            <h3 class="text-4xl font-black mb-10 leading-relaxed" style="color: ${text_color};">${q.question}</h3>
            <div class="space-y-6" id="options-container"></div>
        </div>
        <div class="text-center">
            <button id="next-btn" class="px-16 py-6 rounded-3xl text-3xl font-black shadow-2xl transition-all opacity-50 cursor-not-allowed" style="background: ${primary_color}; color: white;" disabled>التالي ⬅️</button>
        </div>
        <div id="feedback" class="mt-10 text-center text-3xl font-black rounded-3xl p-8 hidden shadow-2xl"></div>
    `;

    const optsContainer = document.getElementById('options-container');
    q.options.forEach((opt, idx) => {
        const el = document.createElement('div');
        el.className = 'quiz-option rounded-2xl p-8 cursor-pointer shadow-lg';
        el.style.backgroundColor = surface_color;
        el.style.border = `4px solid ${primary_color}40`;
        el.style.color = text_color;
        el.innerHTML = `<div class="flex items-center gap-6"><div class="flex-shrink-0 w-16 h-16 rounded-2xl flex items-center justify-center text-3xl font-black shadow-lg" style="background: ${primary_color}; color: white;">${String.fromCharCode(65+idx)}</div><span class="text-3xl font-bold">${opt}</span></div>`;
        el.addEventListener('click', () => {
            if (selectedAnswers[currentQuestionIndex] !== null) return;
            selectedAnswers[currentQuestionIndex] = idx;
            const correct = idx === q.correct;
            if (correct) { score++; el.style.backgroundColor = accent_color+'30'; el.style.borderColor = accent_color; el.style.borderWidth = '5px'; el.classList.add('correct'); showFeedback('✅ إجابة صحيحة! أحسنت!', accent_color, 'white'); }
            else {
                el.style.backgroundColor = '#dc262630'; el.style.borderColor = '#dc2626'; el.style.borderWidth = '5px'; el.classList.add('incorrect');
                const correctEl = optsContainer.children[q.correct];
                correctEl.style.backgroundColor = accent_color+'30'; correctEl.style.borderColor = accent_color; correctEl.style.borderWidth = '5px';
                showFeedback('❌ إجابة خاطئة. الإجابة الصحيحة محددة باللون الأخضر', '#dc2626', 'white');
            }
            document.querySelectorAll('.quiz-option').forEach(opt => { opt.classList.add('disabled'); opt.style.cursor = 'not-allowed'; opt.style.opacity = '0.7'; });
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false; nextBtn.classList.remove('opacity-50', 'cursor-not-allowed'); nextBtn.classList.add('hover:scale-110');
        });
        optsContainer.appendChild(el);
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        currentQuestionIndex++;
        renderQuiz();
    });
}

function showFeedback(msg, bg, color) {
    const fb = document.getElementById('feedback');
    fb.textContent = msg;
    fb.style.backgroundColor = bg;
    fb.style.color = color;
    fb.classList.remove('hidden');
}

// ======================== تشغيل التطبيق ========================
renderLesson();
</script>
